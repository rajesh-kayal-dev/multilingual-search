 <style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .material-symbols-rounded {
    font-size: inherit;
    line-height: 1;
    vertical-align: middle;
  }

  /* ==============================
     SIDEBAR
  ============================== */

  .admin-sidebar {
    background: #19462e;
    color: #ffffff;
  }

  .admin-sidebar a {
    transition: background-color .2s ease, color .2s ease;
  }

  /* Navigation default state */
  .admin-sidebar #nav a:not(.active),
  .admin-sidebar #nav button:not(.active) {
    color: #e5f0e8;
    background-color: transparent;
  }

  /* Navigation icons */
  .admin-sidebar #nav a:not(.active) *,
  .admin-sidebar #nav button:not(.active) * {
    color: inherit;
  }

  /* Navigation hover */
  .admin-sidebar #nav a:not(.active):hover,
  .admin-sidebar #nav button:not(.active):hover {
    background: rgb(255 255 255 / 12%);
    color: #ffffff;
  }

  /* Active navigation item */
  .admin-sidebar #nav a.active,
  .admin-sidebar #nav button.active {
    background: #fbbf24 !important;
    color: #19462e !important;
    font-weight: 800 !important;
    border-left: 4px solid #ffffff;
    border-radius: 10px;
  }

  /* Active item icons */
  .admin-sidebar #nav a.active *,
  .admin-sidebar #nav button.active * {
    color: #19462e !important;
  }

  /* ==============================
     HEADER
  ============================== */

  .admin-header {
    background: rgb(255 255 255 / 92%);
    backdrop-filter: blur(16px);
  }

  /* ==============================
     MAIN DASHBOARD
  ============================== */

  .admin-main {
    background: #f7f8f3;
    min-height: calc(100vh - 65px);
  }

  /* ==============================
     INPUTS AND FILTERS
  ============================== */

  .admin-input {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #ffffff;
    color: #292524;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .admin-input:focus {
    border-color: #328653;
    box-shadow: 0 0 0 3px rgb(50 134 83 / 12%);
  }

  /* ==============================
     THEME BUTTON
  ============================== */

  .theme-button {
    transition: background .2s, transform .2s;
  }

  .theme-button:hover {
    background: #f0f7f2;
    transform: translateY(-1px);
  }

  /* ==============================
     RESPONSIVE
  ============================== */

  @media (max-width: 767px) {
    .admin-main {
      min-height: calc(100vh - 65px);
    }
  }
</style>

</head>
